<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>AI RAG Email Campaigner — Admin & Outreach Studio</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Marked.js for Markdown viewer -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- DOMPurify -->
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'charcoal-deep': '#080A0D',
            'charcoal': '#111418',
            'graphite': '#1A1D21',
            'silver': '#C8CBD0',
            'silver-bright': '#E8EAEC',
            'silver-muted': '#9EA3AA',
            'gold': '#D6A84F',
            'gold-bright': '#F0C76A',
            'gold-deep': '#9C7229',
            'text-primary': '#F5F5F3',
            'text-muted': '#8C9299',
          }
        }
      }
    }
  </script>

  <style>
    :root {
      --bg-charcoal-deep: #080A0D;
      --bg-charcoal: #111418;
      --bg-graphite: #1A1D21;
      --structure-silver: #C8CBD0;
      --structure-silver-bright: #E8EAEC;
      --structure-silver-muted: #9EA3AA;
      --accent-gold: #D6A84F;
      --accent-gold-bright: #F0C76A;
      --accent-gold-deep: #9C7229;
      --text-primary: #F5F5F3;
      --text-muted: #8C9299;
    }
    body {
      background-color: #080A0D;
      color: #F5F5F3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #080A0D;
    }
    ::-webkit-scrollbar-thumb {
      background: #1A1D21;
      border: 1px solid rgba(158, 163, 170, 0.2);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #2A2E33;
    }
  </style>
</head>
<body class="bg-charcoal-deep text-text-primary min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const API_BASE = window.location.origin;

    async function safeJson(res) {
      const text = await res.text();
      try {
        return JSON.parse(text);
      } catch (e) {
        return { detail: text || `Server error (${res.status})` };
      }
    }

function App() {

      const [token, setToken] = useState(localStorage.getItem("rag_auth_token") || "");
      const [currentUser, setCurrentUser] = useState(null);
      const [bots, setBots] = useState([]);
      const [activeBot, setActiveBot] = useState(null);
      const [contacts, setContacts] = useState([]);
      const [campaigns, setCampaigns] = useState([]);
      const [currentView, setCurrentView] = useState("create_campaign"); // "create_campaign" (default guided), "campaigns", "contacts", "crawl"
      
      // Auth state: strictly LOGIN | REGISTER
      const [authMode, setAuthMode] = useState("login"); // "login" | "register"
      const [isVerifyingOtp, setIsVerifyingOtp] = useState(false);
      const [authEmail, setAuthEmail] = useState("");
      const [authPassword, setAuthPassword] = useState("");
      const [authOtp, setAuthOtp] = useState("");
      const [authError, setAuthError] = useState("");
      const [authNotice, setAuthNotice] = useState("");
      const [isSubmitting, setIsSubmitting] = useState(false);

      // Modals
      const [showCreateBotModal, setShowCreateBotModal] = useState(false);
      const [newBotName, setNewBotName] = useState("");
      const [newBotUrl, setNewBotUrl] = useState("");
      const [toastMessage, setToastMessage] = useState("");

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(""), 3500);
      };

      // Check session
      useEffect(() => {
        if (token) {
          fetch(`${API_BASE}/api/auth/me`, {
            headers: { Authorization: `Bearer ${token}` },
          })
            .then((res) => {
              if (!res.ok) throw new Error("Invalid session");
              return res.json();
            })
            .then((user) => {
              setCurrentUser(user);
              loadInitialData();
            })
            .catch(() => {
              handleLogout();
            });
        }
      }, [token]);

      const loadInitialData = () => {
        loadBots();
        loadContacts();
        loadCampaigns();
      };

      const loadBots = () => {
        if (!token) return;
        fetch(`${API_BASE}/api/bots`, { headers: { Authorization: `Bearer ${token}` } })
          .then((res) => res.json())
          .then((data) => {
            const list = data.bots || [];
            setBots(list);
            if (list.length > 0 && !activeBot) {
              setActiveBot(list[0]);
            } else if (activeBot) {
              const updated = list.find((b) => b.id === activeBot.id);
              if (updated) setActiveBot(updated);
            }
          })
          .catch((err) => console.error("Error loading bots:", err));
      };

      const loadContacts = () => {
        if (!token) return;
        fetch(`${API_BASE}/api/contacts`, { headers: { Authorization: `Bearer ${token}` } })
          .then((res) => res.json())
          .then((data) => setContacts(data.contacts || []))
          .catch((err) => console.error("Error loading contacts:", err));
      };

      const loadCampaigns = () => {
        if (!token) return;
        fetch(`${API_BASE}/api/campaigns`, { headers: { Authorization: `Bearer ${token}` } })
          .then((res) => res.json())
          .then((data) => setCampaigns(data.campaigns || []))
          .catch((err) => console.error("Error loading campaigns:", err));
      };

      // AUTHENTICATION HANDLERS (Real OTP Flow)
      const handleInitiateAuth = async (e) => {
        e.preventDefault();
        setAuthError("");
        setAuthNotice("");
        setIsSubmitting(true);
        try {
          if (authMode === "login") {
            const res = await fetch(`${API_BASE}/api/auth/initiate-login`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email: authEmail.trim(), password: authPassword }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || "Authentication failed");
            setIsVerifyingOtp(true);
            setAuthNotice("We sent a 6-digit verification code to your email address.");
          } else {
            const res = await fetch(`${API_BASE}/api/auth/register`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email: authEmail.trim(), password: authPassword }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || "Registration failed");
            setIsVerifyingOtp(true);
            setAuthNotice("Account created! We sent a 6-digit verification code to your email address.");
          }
        } catch (err) {
          setAuthError(err.message);
        } finally {
          setIsSubmitting(false);
        }
      };

      const handleVerifyOtp = async (e) => {
        e.preventDefault();
        setAuthError("");
        setAuthNotice("");
        if (!authOtp.trim()) {
          setAuthError("Please enter the 6-digit verification code.");
          return;
        }
        setIsSubmitting(true);
        try {
          const res = await fetch(`${API_BASE}/api/auth/verify-otp`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: authEmail.trim(), otp: authOtp.trim() }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || "Invalid or expired verification code.");
          localStorage.setItem("rag_auth_token", data.access_token);
          setToken(data.access_token);
          setIsVerifyingOtp(false);
          setAuthOtp("");
          showToast("Verified and logged in successfully!");
        } catch (err) {
          setAuthError(err.message);
        } finally {
          setIsSubmitting(false);
        }
      };

      const handleResendOtp = async () => {
        setAuthError("");
        try {
          const res = await fetch(`${API_BASE}/api/auth/resend-otp`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: authEmail.trim() }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || "Failed to resend code");
          setAuthNotice("A fresh 6-digit verification code has been dispatched to your email address.");
        } catch (err) {
          setAuthError(err.message);
        }
      };

      const handleLogout = () => {
        localStorage.removeItem("rag_auth_token");
        setToken("");
        setCurrentUser(null);
        setBots([]);
        setContacts([]);
        setCampaigns([]);
        setActiveBot(null);
        setIsVerifyingOtp(false);
      };

      const handleCreateBot = async (e) => {
        e.preventDefault();
        if (!newBotName.trim() || !newBotUrl.trim()) return;
        try {
          const res = await fetch(`${API_BASE}/api/bots`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({ name: newBotName.trim(), website_url: newBotUrl.trim() }),
          });
          const bot = await res.json();
          if (!res.ok) throw new Error(bot.detail || "Bot creation failed");

          try {
            await fetch(`${API_BASE}/api/bots/${bot.id}/crawl`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${token}`,
              },
              body: JSON.stringify({ max_pages: 50 }),
            });
          } catch (crawlErr) {
            console.error("Auto-crawl error:", crawlErr);
          }

          setShowCreateBotModal(false);
          setNewBotName("");
          setNewBotUrl("");
          showToast(`Knowledge source "${bot.name}" created! Crawling started.`);
          loadBots();
          setActiveBot(bot);
          setCurrentView("crawl");
        } catch (err) {
          alert(err.message);
        }
      };

      // Unauthenticated view (Real Email OTP Flow)
      if (!token || !currentUser) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-charcoal-deep">
            <div className="w-full max-w-md bg-graphite border border-silver-muted/20 rounded-2xl p-8 shadow-2xl">
              <div className="flex items-center gap-3 mb-6">
                <div className="w-10 h-10 rounded-xl bg-gold flex items-center justify-center text-charcoal-deep font-black text-xl shadow-lg">
                  ✉️
                </div>
                <div>
                  <h1 className="text-xl font-bold text-text-primary tracking-tight">AI RAG Email Campaigner</h1>
                  <p className="text-xs text-text-muted">Personalized B2B Outreach from Website Knowledge</p>
                </div>
              </div>

              {authError && (
                <div className="mb-4 p-3 bg-rose-950/40 border border-rose-500/30 rounded-lg text-rose-300 text-xs">
                  {authError}
                </div>
              )}

              {authNotice && (
                <div className="mb-4 p-3 bg-emerald-950/40 border border-emerald-500/30 rounded-lg text-emerald-300 text-xs">
                  {authNotice}
                </div>
              )}

              {isVerifyingOtp ? (
                <div>
                  <div className="text-center mb-6">
                    <div className="w-12 h-12 rounded-full bg-gold/10 border border-gold/30 text-gold flex items-center justify-center mx-auto mb-3 text-xl">
                      📧
                    </div>
                    <h2 className="text-lg font-bold text-text-primary">Verify your email</h2>
                    <p className="text-xs text-silver-muted mt-1">
                      We sent a 6-digit verification code to <span className="text-gold-bright font-semibold">{authEmail}</span>.
                    </p>
                  </div>

                  <form onSubmit={handleVerifyOtp} className="space-y-4">
                    <div>
                      <label className="block text-xs font-medium text-silver-muted mb-1 text-center">Enter 6-Digit Code</label>
                      <input
                        type="text"
                        required
                        maxLength="6"
                        value={authOtp}
                        onChange={(e) => setAuthOtp(e.target.value)}
                        placeholder="••••••"
                        autoFocus
                        className="w-full px-4 py-3 bg-charcoal border border-silver-muted/20 rounded-xl text-text-primary placeholder:text-text-muted/50 focus:outline-none focus:border-gold transition-colors text-xl font-mono tracking-widest text-center"
                      />
                    </div>

                    <button
                      type="submit"
                      disabled={isSubmitting}
                      className="w-full py-3 bg-gold hover:bg-gold-bright active:bg-gold-deep text-charcoal-deep font-bold rounded-xl shadow-lg transition-all text-sm mt-2 flex items-center justify-center gap-2 disabled:opacity-50"
                    >
                      {isSubmitting ? "Verifying..." : "Verify & Continue"}
                    </button>

                    <div className="flex items-center justify-between pt-3 border-t border-silver-muted/15 text-xs">
                      <button
                        type="button"
                        onClick={handleResendOtp}
                        className="text-gold hover:underline font-medium"
                      >
                        Resend OTP
                      </button>
                      <button
                        type="button"
                        onClick={() => {
                          setIsVerifyingOtp(false);
                          setAuthOtp("");
                          setAuthError("");
                          setAuthNotice("");
                        }}
                        className="text-silver-muted hover:text-text-primary transition-colors"
                      >
                        ← Change Email / Back
                      </button>
                    </div>
                  </form>
                </div>
              ) : (
                <div>
                  {/* Auth Mode Tabs: strictly LOGIN | REGISTER */}
                  <div className="flex bg-charcoal rounded-xl p-1 mb-6 border border-silver-muted/15">
                    <button
                      type="button"
                      onClick={() => {
                        setAuthMode("login");
                        setAuthError("");
                        setAuthNotice("");
                      }}
                      className={`flex-1 py-2 text-xs font-semibold rounded-lg transition-all ${
                        authMode === "login"
                          ? "bg-graphite text-gold shadow-md"
                          : "text-text-muted hover:text-text-primary"
                      }`}
                    >
                      LOGIN
                    </button>
                    <button
                      type="button"
                      onClick={() => {
                        setAuthMode("register");
                        setAuthError("");
                        setAuthNotice("");
                      }}
                      className={`flex-1 py-2 text-xs font-semibold rounded-lg transition-all ${
                        authMode === "register"
                          ? "bg-graphite text-gold shadow-md"
                          : "text-text-muted hover:text-text-primary"
                      }`}
                    >
                      REGISTER
                    </button>
                  </div>

                  <form onSubmit={handleInitiateAuth} className="space-y-4">
                    <div>
                      <label className="block text-xs font-medium text-silver-muted mb-1">Email Address</label>
                      <input
                        type="email"
                        required
                        value={authEmail}
                        onChange={(e) => setAuthEmail(e.target.value)}
                        placeholder="name@company.com"
                        className="w-full px-4 py-2.5 bg-charcoal border border-silver-muted/20 rounded-xl text-text-primary placeholder:text-text-muted/50 focus:outline-none focus:border-gold transition-colors text-sm"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-medium text-silver-muted mb-1">Password</label>
                      <input
                        type="password"
                        required
                        value={authPassword}
                        onChange={(e) => setAuthPassword(e.target.value)}
                        placeholder="••••••••••••"
                        className="w-full px-4 py-2.5 bg-charcoal border border-silver-muted/20 rounded-xl text-text-primary placeholder:text-text-muted/50 focus:outline-none focus:border-gold transition-colors text-sm"
                      />
                    </div>
                    <button
                      type="submit"
                      disabled={isSubmitting}
                      className="w-full py-3 bg-gold hover:bg-gold-bright active:bg-gold-deep text-charcoal-deep font-bold rounded-xl shadow-lg transition-all text-sm mt-2 flex items-center justify-center gap-2 disabled:opacity-50"
                    >
                      {isSubmitting
                        ? "Processing..."
                        : authMode === "login"
                        ? "Sign In & Send Code"
                        : "Register & Send Code"}
                    </button>
                  </form>
                </div>
              )}

              <div className="mt-6 pt-6 border-t border-silver-muted/15 text-center text-xs text-text-muted">
                Enterprise AI RAG Email Campaign & Audience Platform
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex bg-charcoal-deep text-text-primary">
          {/* Toast Notification */}
          {toastMessage && (
            <div className="fixed top-5 right-5 z-50 bg-graphite border border-gold/40 text-gold-bright px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 text-sm animate-bounce">
              <svg className="w-5 h-5 text-gold" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7" />
              </svg>
              <span>{toastMessage}</span>
            </div>
          )}

          {/* Left Sidebar */}
          <aside className="w-64 bg-charcoal border-r border-silver-muted/15 flex flex-col shrink-0">
            {/* Logo */}
            <div className="p-5 border-b border-silver-muted/15 flex items-center gap-3">
              <div className="w-9 h-9 rounded-xl bg-gold flex items-center justify-center text-charcoal-deep font-black text-lg shadow-md">
                ✉️
              </div>
              <div>
                <h2 className="font-bold text-sm text-text-primary tracking-tight">RAG Campaigner</h2>
                <p className="text-[11px] text-text-muted">AI Cold Outreach Studio</p>
              </div>
            </div>

            {/* Knowledge Source Bot Switcher */}
            <div className="p-4 border-b border-silver-muted/15 bg-graphite/40">
              <label className="block text-[10px] font-bold text-silver-muted uppercase tracking-wider mb-1.5">
                Website Knowledge Source
              </label>
              {bots.length === 0 ? (
                <button
                  type="button"
                  onClick={() => setShowCreateBotModal(true)}
                  className="w-full py-2 bg-charcoal border border-dashed border-gold/40 text-gold-bright rounded-xl text-xs font-semibold hover:border-gold transition-colors flex items-center justify-center gap-1.5"
                >
                  <span>+ Add Website Source</span>
                </button>
              ) : (
                <div className="flex gap-2">
                  <select
                    value={activeBot ? activeBot.id : ""}
                    onChange={(e) => {
                      const selected = bots.find((b) => b.id === e.target.value);
                      setActiveBot(selected);
                    }}
                    className="flex-1 bg-charcoal border border-silver-muted/20 rounded-xl px-2.5 py-1.5 text-xs text-text-primary font-medium focus:outline-none focus:border-gold transition-colors truncate"
                  >
                    {bots.map((b) => (
                      <option key={b.id} value={b.id}>
                        {b.name} ({b.status})
                      </option>
                    ))}
                  </select>
                  <button
                    type="button"
                    onClick={() => setShowCreateBotModal(true)}
                    title="Add new website source"
                    className="p-1.5 bg-charcoal border border-silver-muted/20 rounded-xl text-gold-bright hover:border-gold transition-colors text-xs font-bold"
                  >
                    +
                  </button>
                </div>
              )}
            </div>

            {/* Prioritized Campaign Navigation */}
            <nav className="p-3 space-y-1 flex-1 overflow-y-auto">
              <div className="px-3 pt-2 pb-1 text-[10px] font-bold text-silver-muted uppercase tracking-wider">
                Outreach Engine
              </div>
              <button
                type="button"
                onClick={() => setCurrentView("create_campaign")}
                className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold transition-all ${
                  currentView === "create_campaign"
                    ? "bg-graphite text-gold border border-gold/30 shadow-md"
                    : "text-silver hover:bg-graphite/40 hover:text-text-primary"
                }`}
              >
                <span>🚀</span>
                <span>Create Campaign</span>
              </button>

              <button
                type="button"
                onClick={() => setCurrentView("campaigns")}
                className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold transition-all ${
                  currentView === "campaigns"
                    ? "bg-graphite text-gold border border-gold/30 shadow-md"
                    : "text-silver hover:bg-graphite/40 hover:text-text-primary"
                }`}
              >
                <span>📋</span>
                <span>Campaign History</span>
                <span className="ml-auto px-1.5 py-0.5 rounded-md text-[10px] bg-charcoal text-silver-muted font-bold">
                  {campaigns.length}
                </span>
              </button>

              <button
                type="button"
                onClick={() => setCurrentView("contacts")}
                className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold transition-all ${
                  currentView === "contacts"
                    ? "bg-graphite text-gold border border-gold/30 shadow-md"
                    : "text-silver hover:bg-graphite/40 hover:text-text-primary"
                }`}
              >
                <span>👥</span>
                <span>Contacts & Leads</span>
                <span className="ml-auto px-1.5 py-0.5 rounded-md text-[10px] bg-charcoal text-silver-muted font-bold">
                  {contacts.length}
                </span>
              </button>

              <button
                type="button"
                onClick={() => setCurrentView("crawl")}
                className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-semibold transition-all ${
                  currentView === "crawl"
                    ? "bg-graphite text-gold border border-gold/30 shadow-md"
                    : "text-silver hover:bg-graphite/40 hover:text-text-primary"
                }`}
              >
                <span>🌐</span>
                <span>Website Knowledge</span>
              </button>
            </nav>

            {/* User footer */}
            <div className="p-4 border-t border-silver-muted/15 bg-graphite/30 flex items-center justify-between">
              <div className="overflow-hidden">
                <p className="text-xs font-bold text-text-primary truncate">{currentUser.email}</p>
                <p className="text-[10px] text-text-muted">User ID: {currentUser.id.slice(0, 8)}...</p>
              </div>
              <button
                type="button"
                onClick={handleLogout}
                title="Log Out"
                className="p-1.5 hover:bg-charcoal text-silver-muted hover:text-rose-400 rounded-lg transition-colors"
              >
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                </svg>
              </button>
            </div>
          </aside>

          {/* Main Workspace Area */}
          <main className="flex-1 flex flex-col min-w-0 overflow-y-auto">
            {currentView === "create_campaign" && (
              <GuidedCampaignWorkflow
                token={token}
                bots={bots}
                activeBot={activeBot}
                setActiveBot={setActiveBot}
                contacts={contacts}
                reloadContacts={loadContacts}
                reloadBots={loadBots}
                reloadCampaigns={loadCampaigns}
                showToast={showToast}
                onGoToHistory={() => setCurrentView("campaigns")}
              />
            )}

            {currentView === "campaigns" && (
              <CampaignsView
                token={token}
                bots={bots}
                contacts={contacts}
                campaigns={campaigns}
                reloadCampaigns={loadCampaigns}
                showToast={showToast}
              />
            )}

            {currentView === "contacts" && (
              <ContactsView
                token={token}
                contacts={contacts}
                reloadContacts={loadContacts}
                showToast={showToast}
                onSelectContactForGenerator={() => setCurrentView("create_campaign")}
              />
            )}

            {currentView === "email_generator" && (
              <EmailGeneratorView
                token={token}
                bots={bots}
                activeBot={activeBot}
                contacts={contacts}
                showToast={showToast}
              />
            )}

            {currentView === "crawl" && (
              <CrawlKnowledgeView
                token={token}
                bot={activeBot}
                onBotUpdated={loadBots}
                showToast={showToast}
              />
            )}

            {currentView === "legacy_bots" && (
              <BotsOverviewView
                token={token}
                bots={bots}
                activeBot={activeBot}
                onSelectBot={setActiveBot}
                onNewBot={() => setShowCreateBotModal(true)}
                onGoToCrawl={() => setCurrentView("crawl")}
              />
            )}

            {currentView === "branding" && (
              <BrandingCustomizerView
                token={token}
                bot={activeBot}
                showToast={showToast}
              />
            )}

            {currentView === "embed" && (
              <EmbedCodeView bot={activeBot} showToast={showToast} />
            )}

            {currentView === "conversations" && (
              <ConversationsView token={token} bot={activeBot} />
            )}
          </main>

          {/* Create Knowledge Bot Modal */}
          {showCreateBotModal && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="bg-graphite border border-silver-muted/20 rounded-2xl w-full max-w-md p-6 shadow-2xl">
                <h3 className="text-base font-bold text-text-primary mb-1">Add Website Knowledge Source</h3>
                <p className="text-xs text-text-muted mb-4">
                  Provide a website URL. Our crawler extracts facts, builds embeddings, and indexes knowledge for personalized email generation.
                </p>
                <form onSubmit={handleCreateBot} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-silver-muted mb-1">Source Name / Organization</label>
                    <input
                      type="text"
                      required
                      value={newBotName}
                      onChange={(e) => setNewBotName(e.target.value)}
                      placeholder="e.g. Acme Cloud or BioVance Health"
                      className="w-full px-3 py-2 bg-charcoal border border-silver-muted/20 rounded-xl text-xs text-text-primary focus:outline-none focus:border-gold"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-silver-muted mb-1">Target Website URL</label>
                    <input
                      type="url"
                      required
                      value={newBotUrl}
                      onChange={(e) => setNewBotUrl(e.target.value)}
                      placeholder="https://example.com"
                      className="w-full px-3 py-2 bg-charcoal border border-silver-muted/20 rounded-xl text-xs text-text-primary focus:outline-none focus:border-gold"
                    />
                  </div>
                  <div className="flex justify-end gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setShowCreateBotModal(false)}
                      className="px-4 py-2 bg-charcoal border border-silver-muted/20 text-silver hover:text-text-primary rounded-xl text-xs"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 bg-gold hover:bg-gold-bright text-charcoal-deep font-bold rounded-xl text-xs"
                    >
                      Create & Start Crawling
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

// -------------------------------------------------------------
    // GUIDED CAMPAIGN WORKFLOW (P0 End-to-End MVP Guided Flow)
    // -------------------------------------------------------------
    function GuidedCampaignWorkflow({
      token,
      bots,
      activeBot,
      setActiveBot,
      contacts,
      reloadContacts,
      reloadBots,
      reloadCampaigns,
      showToast,
      onGoToHistory,
    }) {
      const [currentStep, setCurrentStep] = useState(1);

      // Step 1: Lead Source State
      const [isImporting, setIsImporting] = useState(false);
      const [importedCount, setImportedCount] = useState(0);
      const [leadSourceSuccess, setLeadSourceSuccess] = useState(false);
      const [leadSourceName, setLeadSourceName] = useState("");
      const csvFileInputRef = useRef(null);

      // Step 2: Website Knowledge State
      const [websiteUrl, setWebsiteUrl] = useState("https://books.toscrape.com");
      const [sourceName, setSourceName] = useState("Books To Scrape Store");
      const [isAnalyzing, setIsAnalyzing] = useState(false);
      const [analysisStage, setAnalysisStage] = useState(""); // crawling, extracting, chunking, embeddings, ready
      const [websiteKnowledgeReady, setWebsiteKnowledgeReady] = useState(false);

      // Step 3: Audience State
      const [selectedContactIds, setSelectedContactIds] = useState([]);

      // Step 4: Campaign Setup State
      const [campaignName, setCampaignName] = useState("Literature & Academic Library Outreach");
      const [campaignGoal, setCampaignGoal] = useState("Highlight curated corporate library collections and literary packages tailored to recipient roles");
      const [isGenerating, setIsGenerating] = useState(false);

      // Step 5 & 6: Review & Send State
      const [activeCampaign, setActiveCampaign] = useState(null);
      const [isSending, setIsSending] = useState(false);
      const [sendResult, setSendResult] = useState(null);
      const [selectedEmailIdx, setSelectedEmailIdx] = useState(0);
      const [editedSubject, setEditedSubject] = useState("");
      const [editedBody, setEditedBody] = useState("");
      const [isSavingEmail, setIsSavingEmail] = useState(false);
      const [isApplyingAll, setIsApplyingAll] = useState(false);
      const [recipientSearch, setRecipientSearch] = useState("");

      // HubSpot State
      const [showHubSpotModal, setShowHubSpotModal] = useState(false);
      const [hubSpotStatus, setHubSpotStatus] = useState(null);
      const [isTestingHubSpot, setIsTestingHubSpot] = useState(false);
      const [hubSpotOAuth, setHubSpotOAuth] = useState({ connected: false, portal_id: null });
      const [isConnectingHubSpot, setIsConnectingHubSpot] = useState(false);

      const checkHubSpotOAuthStatus = async () => {
        if (!token) return;
        try {
          const res = await fetch(`${API_BASE}/api/auth/hubspot/status`, {
            headers: { Authorization: `Bearer ${token}` },
          });
          if (res.ok) {
            const data = await safeJson(res);
            setHubSpotOAuth(data);
          }
        } catch (err) {
          console.error("HubSpot status error:", err);
        }
      };

      useEffect(() => {
        checkHubSpotOAuthStatus();
      }, [token]);

      useEffect(() => {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get("hubspot") === "connected") {
          showToast("✓ HubSpot connected successfully via OAuth 2.0!");
          window.history.replaceState({}, document.title, window.location.pathname);
          checkHubSpotOAuthStatus();
          handleHubSpotConnect();
        } else if (urlParams.get("hubspot_error")) {
          alert(`HubSpot Connection Error: ${decodeURIComponent(urlParams.get("hubspot_error"))}`);
          window.history.replaceState({}, document.title, window.location.pathname);
        }
      }, [token]);

      const handleConnectHubSpotOAuth = async () => {
        setIsConnectingHubSpot(true);
        try {
          const res = await fetch(`${API_BASE}/api/auth/hubspot/authorize`, {
            headers: { Authorization: `Bearer ${token}` },
          });
          const data = await safeJson(res);
          if (data.url) {
            window.location.href = data.url;
          } else {
            throw new Error(data.detail || "Could not generate authorization link");
          }
        } catch (err) {
          alert(err.message);
          setIsConnectingHubSpot(false);
        }
      };

      const handleDisconnectHubSpot = async () => {
        if (!confirm("Are you sure you want to disconnect your HubSpot account?")) return;
        try {
          const res = await fetch(`${API_BASE}/api/auth/hubspot/disconnect`, {
            method: "POST",
            headers: { Authorization: `Bearer ${token}` },
          });
          if (res.ok) {
            setHubSpotOAuth({ connected: false, portal_id: null });
            showToast("HubSpot disconnected.");
            checkHubSpotOAuthStatus();
          }
        } catch (err) {
          alert(err.message);
        }
      };

      // Auto-select initial contacts if contacts loaded
      useEffect(() => {
        if (contacts.length > 0 && selectedContactIds.length === 0) {
          setSelectedContactIds(contacts.map((c) => c.id));
        }
      }, [contacts]);

      // Check if existing bot is already READY
      useEffect(() => {
        if (activeBot && activeBot.status === "READY") {
          setWebsiteKnowledgeReady(true);
        }
      }, [activeBot]);

      // STEP 1 HANDLERS
      const handleTestHubSpotConnection = async () => {
        setIsTestingHubSpot(true);
        try {
          const res = await fetch(`${API_BASE}/api/contacts/hubspot/test-connection`, {
            headers: { Authorization: `Bearer ${token}` },
          });
          const data = await safeJson(res);
          setHubSpotStatus(data);
        } catch (err) {
          setHubSpotStatus({
            success: false,
            configured: false,
            message: `Connection test error: ${err.message}`,
            contact_count: 0,
          });
        } finally {
          setIsTestingHubSpot(false);
        }
      };

      const handleHubSpotConnect = async () => {
        setIsImporting(true);
        try {
          const res = await fetch(`${API_BASE}/api/contacts/import-hubspot`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({ limit: 100, use_demo_fallback: true }),
          });
          const data = await safeJson(res);
          if (!res.ok) throw new Error(data.detail || "HubSpot connection failed");
          setImportedCount(data.imported);
          setLeadSourceSuccess(true);
          const srcLabel = data.source === "hubspot_oauth"
            ? `HubSpot CRM (Portal #${hubSpotOAuth.portal_id || "Connected"})`
            : data.source === "hubspot_crm"
            ? "HubSpot CRM (Server Live Sync)"
            : "HubSpot Demo Connection";
          setLeadSourceName(srcLabel);
          reloadContacts();
          setShowHubSpotModal(false);
          showToast(`✓ Your leads are ready: ${data.imported} contacts imported via ${srcLabel}`);
        } catch (err) {
          alert(err.message);
        } finally {
          setIsImporting(false);
        }
      };

      const handleCsvUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setIsImporting(true);
        const formData = new FormData();
        formData.append("file", file);
        try {
          const res = await fetch(`${API_BASE}/api/contacts/import-csv`, {
            method: "POST",
            headers: { Authorization: `Bearer ${token}` },
            body: formData,
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || "CSV import failed");
          setImportedCount(data.imported);
          setLeadSourceSuccess(true);
          setLeadSourceName(`CSV Upload (${file.name})`);
          reloadContacts();
          showToast(`✓ Your leads are ready: ${data.imported} contacts imported`);
        } catch (err) {
          alert(err.message);
        } finally {
          setIsImporting(false);
          if (csvFileInputRef.current) csvFileInputRef.current.value = "";
        }
      };

      // STEP 2 HANDLERS: Real Crawler & Indexing Pipeline
      const handleAnalyzeWebsite = async () => {
        if (!websiteUrl.trim()) {
          alert("Please enter a valid website URL");
          return;
        }
        setIsAnalyzing(true);
        setWebsiteKnowledgeReady(false);
        setAnalysisStage("crawling");

        try {
          // 1. Create bot
          const botRes = await fetch(`${API_BASE}/api/bots`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({
              name: sourceName.trim() || "Website Knowledge Source",
              website_url: websiteUrl.trim(),
            }),
          });
          const newBot = await botRes.json();
          if (!botRes.ok) throw new Error(newBot.detail || "Failed to register website");
          setActiveBot(newBot);

          // 2. Trigger real crawler pipeline
          await fetch(`${API_BASE}/api/bots/${newBot.id}/crawl`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({ max_pages: 5 }),
          });

          // 3. Poll bot status until READY
          let attempts = 0;
          const pollInterval = setInterval(async () => {
            attempts++;
            try {
              const checkRes = await fetch(`${API_BASE}/api/bots/${newBot.id}`, {
                headers: { Authorization: `Bearer ${token}` },
              });
              const updated = await checkRes.json();
              if (updated.status === "CRAWLING") {
                setAnalysisStage("extracting");
              } else if (updated.status === "PROCESSING") {
                setAnalysisStage("embeddings");
              } else if (updated.status === "READY") {
                clearInterval(pollInterval);
                setAnalysisStage("ready");
                setWebsiteKnowledgeReady(true);
                setIsAnalyzing(false);
                setActiveBot(updated);
                reloadBots();
                showToast("✓ Your website knowledge is ready.");
              } else if (updated.status === "FAILED" || attempts > 60) {
                clearInterval(pollInterval);
                setIsAnalyzing(false);
                alert("Website analysis timed out or failed. Please verify the URL.");
              }
            } catch (pollErr) {
              console.error("Poll error:", pollErr);
            }
          }, 2500);
        } catch (err) {
          setIsAnalyzing(false);
          alert(err.message);
        }
      };

      // STEP 3 HANDLERS: Audience Selection
      const handleToggleAllContacts = () => {
        if (selectedContactIds.length === contacts.length) {
          setSelectedContactIds([]);
        } else {
          setSelectedContactIds(contacts.map((c) => c.id));
        }
      };

      const handleToggleContact = (id) => {
        setSelectedContactIds((prev) =>
          prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]
        );
      };

      // STEP 4 HANDLERS: Real RAG Email Generation
      const handleGenerateEmails = async () => {
        if (!activeBot || activeBot.status !== "READY") {
          alert("Website knowledge is not ready yet. Please complete Step 2.");
          return;
        }
        if (selectedContactIds.length === 0) {
          alert("Please select at least one contact in Step 3.");
          return;
        }
        setIsGenerating(true);
        try {
          // 1. Create campaign
          const campRes = await fetch(`${API_BASE}/api/campaigns`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({
              name: campaignName.trim() || "Targeted Email Campaign",
              bot_id: activeBot.id,
              campaign_goal: campaignGoal.trim(),
              contact_ids: selectedContactIds,
            }),
          });
          const campaign = await safeJson(campRes);
          if (!campRes.ok) throw new Error(campaign.detail || "Failed to create campaign");

          // 2. Generate drafts via RAG
          const genRes = await fetch(`${API_BASE}/api/campaigns/${campaign.id}/generate`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({ campaign_goal: campaignGoal.trim() }),
          });
          const detail = await safeJson(genRes);
          if (!genRes.ok) throw new Error(detail.detail || "Email generation failed");


          setActiveCampaign(detail);
          reloadCampaigns();
          setCurrentStep(5); // Advance to Review
          showToast(`Generated ${detail.emails ? detail.emails.length : 0} personalized email drafts!`);
        } catch (err) {
          alert(err.message);
        } finally {
          setIsGenerating(false);
        }
      };

      // STEP 6 HANDLERS: Mock Send Campaign
      const handleApproveAndSend = async () => {
        if (!activeCampaign) return;
        setIsSending(true);
        try {
          const sendRes = await fetch(`${API_BASE}/api/campaigns/${activeCampaign.id}/send`, {
            method: "POST",
            headers: { Authorization: `Bearer ${token}` },
          });
          const result = await sendRes.json();
          if (!sendRes.ok) throw new Error(result.detail || "Send failed");

          setSendResult(result);
          setCurrentStep(7); // Advance to Result
          reloadCampaigns();
          showToast(`Campaign completed: ${result.emails_sent} emails dispatched`);
        } catch (err) {
          alert(err.message);
        } finally {
          setIsSending(false);
        }
      };

      // Synchronize active draft text when selected contact changes
      useEffect(() => {
        if (activeCampaign && activeCampaign.emails && activeCampaign.emails.length > 0) {
          const currentEmail = activeCampaign.emails[selectedEmailIdx] || activeCampaign.emails[0];
          setEditedSubject(currentEmail.subject || "");
          setEditedBody(currentEmail.body || "");
        }
      }, [activeCampaign, selectedEmailIdx]);

      // Save changes for currently selected email
      const handleSaveCurrentEmail = async () => {
        if (!activeCampaign || !activeCampaign.emails) return;
        const currentEmail = activeCampaign.emails[selectedEmailIdx] || activeCampaign.emails[0];
        if (!currentEmail) return;

        setIsSavingEmail(true);
        try {
          const res = await fetch(`${API_BASE}/api/campaigns/${activeCampaign.id}/emails/${currentEmail.id}`, {
            method: "PUT",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({
              subject: editedSubject.trim(),
              body: editedBody.trim(),
            }),
          });
          const updated = await safeJson(res);
          if (!res.ok) throw new Error(updated.detail || "Failed to save email draft");
          setActiveCampaign(updated);
          reloadCampaigns();
          showToast(`✓ Saved email for ${currentEmail.contact_name || currentEmail.contact_email}`);
        } catch (err) {
          alert(err.message);
        } finally {
          setIsSavingEmail(false);
        }
      };

      // Apply changes across all emails in this campaign
      const handleApplyChangesToAll = async () => {
        if (!activeCampaign || !activeCampaign.emails) return;
        const currentEmail = activeCampaign.emails[selectedEmailIdx] || activeCampaign.emails[0];
        if (!currentEmail) return;

        if (!confirm(`Apply this updated subject and body across all ${activeCampaign.emails.length} emails? Recipient names and companies will automatically be tailored for each contact.`)) {
          return;
        }

        setIsApplyingAll(true);
        try {
          const res = await fetch(`${API_BASE}/api/campaigns/${activeCampaign.id}/emails/apply-all`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({
              subject_template: editedSubject.trim(),
              body_template: editedBody.trim(),
              source_contact_id: currentEmail.contact_id,
            }),
          });
          const updated = await safeJson(res);
          if (!res.ok) throw new Error(updated.detail || "Failed to apply template across emails");
          setActiveCampaign(updated);
          reloadCampaigns();
          showToast(`⚡ Successfully applied changes across all ${updated.emails.length} emails!`);
        } catch (err) {
          alert(err.message);
        } finally {
          setIsApplyingAll(false);
        }
      };


      return (
        <div className="p-8 max-w-5xl mx-auto w-full">
          {/* Header */}
          <div className="mb-8">
            <h1 className="text-2xl font-bold text-text-primary tracking-tight">CREATE EMAIL CAMPAIGN</h1>
            <p className="text-xs text-text-muted mt-1">
              End-to-End Guided Workflow: Lead Source → Real Crawler → Vector Indexing → Personalized RAG Emails → Approval & Send
            </p>
          </div>

          {/* Stepper Navigation */}
          <div className="grid grid-cols-2 md:grid-cols-6 gap-2 mb-8">
            {[
              { num: 1, label: "Lead Source" },
              { num: 2, label: "Website Knowledge" },
              { num: 3, label: "Audience" },
              { num: 4, label: "Campaign Pitch" },
              { num: 5, label: "Review Drafts" },
              { num: 7, label: "Result" },
            ].map((st) => (
              <button
                key={st.num}
                type="button"
                onClick={() => {
                  if (st.num <= currentStep || (st.num === 2 && contacts.length > 0) || (st.num === 3 && websiteKnowledgeReady)) {
                    setCurrentStep(st.num);
                  }
                }}
                className={`p-2.5 rounded-xl border text-left transition-all ${
                  currentStep === st.num
                    ? "bg-graphite border-gold text-gold shadow-lg"
                    : currentStep > st.num
                    ? "bg-charcoal border-emerald-500/40 text-emerald-400"
                    : "bg-charcoal/40 border-silver-muted/15 text-silver-muted opacity-60"
                }`}
              >
                <div className="text-[10px] uppercase font-bold tracking-wider">
                  {currentStep > st.num ? "✓ Done" : `Step ${st.num}`}
                </div>
                <div className="text-xs font-semibold truncate">{st.label}</div>
              </button>
            ))}
          </div>

          {/* STEP 1: LEAD SOURCE */}
          {currentStep === 1 && (
            <div className="bg-graphite border border-silver-muted/20 rounded-2xl p-6 shadow-xl space-y-6">
              <div>
                <h2 className="text-lg font-bold text-text-primary">STEP 1: LEAD SOURCE</h2>
                <p className="text-xs text-text-muted mt-0.5">
                  Import your target B2B leads via CSV file or connect HubSpot demo leads.
                </p>
              </div>

              {/* Lead Source Choice Cards */}
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {/* Option A: Upload CSV */}
                <div className="bg-charcoal border border-silver-muted/20 hover:border-gold/50 rounded-xl p-5 transition-all flex flex-col justify-between">
                  <div>
                    <div className="w-10 h-10 rounded-lg bg-gold/10 border border-gold/30 text-gold flex items-center justify-center text-lg mb-3">
                      📄
                    </div>
                    <h3 className="text-sm font-bold text-text-primary mb-1">Upload CSV (REAL)</h3>
                    <p className="text-xs text-silver-muted mb-4">
                      Upload a CSV file containing columns: <code className="text-gold font-mono">name, email, company, role</code>.
                    </p>
                  </div>
                  <div>
                    <input
                      type="file"
                      ref={csvFileInputRef}
                      accept=".csv"
                      onChange={handleCsvUpload}
                      className="hidden"
                    />
                    <button
                      type="button"
                      disabled={isImporting}
                      onClick={() => csvFileInputRef.current && csvFileInputRef.current.click()}
                      className="w-full py-2.5 bg-gold hover:bg-gold-bright active:bg-gold-deep text-charcoal-deep font-bold rounded-xl text-xs shadow transition-all disabled:opacity-50"
                    >
                      {isImporting ? "Processing CSV..." : "Upload CSV"}
                    </button>
                  </div>
                </div>

                {/* Option B: Connect HubSpot */}
                <div className="bg-charcoal border border-silver-muted/20 hover:border-orange-500/50 rounded-xl p-5 transition-all flex flex-col justify-between">
                  <div>
                    <div className="flex items-center justify-between mb-3">
                      <div className="w-10 h-10 rounded-lg bg-orange-500/10 border border-orange-500/30 text-orange-400 flex items-center justify-center text-lg">
                        🟠
                      </div>
                      {hubSpotOAuth.connected ? (
                        <span className="text-[10px] px-2 py-0.5 rounded bg-emerald-950/60 border border-emerald-500/40 text-emerald-300 font-bold uppercase tracking-wider flex items-center gap-1.5">
                          <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                          OAuth Connected
                        </span>
                      ) : (
                        <span className="text-[10px] px-2 py-0.5 rounded bg-orange-950/60 border border-orange-500/30 text-orange-300 font-bold uppercase tracking-wider">
                          OAuth 2.0 Ready
                        </span>
                      )}
                    </div>
                    <h3 className="text-sm font-bold text-text-primary mb-1">
                      {hubSpotOAuth.connected ? `HubSpot Portal #${hubSpotOAuth.portal_id || "Active"}` : "Connect HubSpot CRM"}
                    </h3>
                    <p className="text-xs text-silver-muted mb-3">
                      {hubSpotOAuth.connected
                        ? "Authenticated via official OAuth 2.0 with automatic token refresh."
                        : "1-click authorize your HubSpot account to sync live leads, or sync via server token."}
                    </p>
                  </div>
                  <div className="space-y-2">
                    {hubSpotOAuth.connected ? (
                      <>
                        <button
                          type="button"
                          disabled={isImporting}
                          onClick={handleHubSpotConnect}
