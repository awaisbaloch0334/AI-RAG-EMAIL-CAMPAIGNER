                  className="px-6 py-2.5 bg-gold hover:bg-gold-bright active:bg-gold-deep text-charcoal-deep font-bold rounded-xl text-xs shadow-xl transition-all disabled:opacity-50 whitespace-nowrap"
                >
                  {isSending ? "Dispatching..." : "Approve & Send Campaign →"}
                </button>
              </div>
            </div>
          )}


          {/* STEP 7: RESULT */}
          {currentStep === 7 && sendResult && (
            <div className="bg-graphite border border-emerald-500/40 rounded-2xl p-8 shadow-2xl text-center space-y-6">
              <div className="w-16 h-16 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 flex items-center justify-center text-3xl mx-auto">
                🎉
              </div>

              <div>
                <h2 className="text-2xl font-bold text-text-primary">Campaign Completed</h2>
                <p className="text-sm text-emerald-400 font-semibold mt-1">
                  {sendResult.emails_sent} emails sent successfully • 0 failed
                </p>
                <p className="text-xs text-silver-muted mt-1">
                  Campaign status updated to <strong className="text-emerald-300">COMPLETED</strong> in PostgreSQL.
                </p>
              </div>

              <div className="p-4 bg-charcoal rounded-xl border border-silver-muted/15 max-w-lg mx-auto text-xs text-silver-muted space-y-1 text-left">
                <div>📬 Provider: <strong className="text-text-primary">MockEmailSenderProvider (Simulated Dispatch)</strong></div>
                <div>📊 Campaign ID: <span className="font-mono text-gold">{sendResult.campaign_id}</span></div>
                <div>⏱️ Status: <span className="text-emerald-400 font-bold uppercase">{sendResult.status}</span></div>
              </div>

              <div className="flex justify-center gap-3 pt-2">
                <button
                  type="button"
                  onClick={() => {
                    setCurrentStep(1);
                    setActiveCampaign(null);
                    setSendResult(null);
                  }}
                  className="px-5 py-2.5 bg-gold hover:bg-gold-bright text-charcoal-deep font-bold rounded-xl text-xs shadow transition-all"
                >
                  + Create Another Campaign
                </button>
                <button
                  type="button"
                  onClick={onGoToHistory}
                  className="px-5 py-2.5 bg-charcoal border border-silver-muted/30 text-text-primary hover:border-gold font-bold rounded-xl text-xs transition-all"
                >
                  View Campaign History
                </button>
              </div>
            </div>
          )}

          {/* HubSpot Connection & Status Modal */}
          {showHubSpotModal && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="bg-graphite border border-silver-muted/20 rounded-2xl w-full max-w-md p-6 shadow-2xl space-y-4">
                <div className="flex items-center justify-between pb-3 border-b border-silver-muted/15">
                  <div className="flex items-center gap-2.5">
                    <div className="w-8 h-8 rounded-lg bg-orange-500/10 border border-orange-500/30 text-orange-400 flex items-center justify-center text-sm font-bold">
                      🟠
                    </div>
                    <div>
                      <h3 className="text-sm font-bold text-text-primary">HubSpot CRM Integration</h3>
                      <p className="text-[10px] text-silver-muted">Official OAuth 2.0 & Private App</p>
                    </div>
                  </div>
                  <button
                    type="button"
                    onClick={() => setShowHubSpotModal(false)}
                    className="text-silver-muted hover:text-text-primary text-xs"
                  >
                    ✕
                  </button>
                </div>

                {/* OAuth 2.0 Status Card */}
                <div className="p-3.5 bg-charcoal border border-silver-muted/20 rounded-xl space-y-2.5">
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-semibold text-silver-muted">User OAuth Connection:</span>
                    {hubSpotOAuth.connected ? (
                      <span className="text-[10px] px-2 py-0.5 rounded bg-emerald-950/60 border border-emerald-500/40 text-emerald-300 font-bold flex items-center gap-1">
                        <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                        Connected (Portal #{hubSpotOAuth.portal_id})
                      </span>
                    ) : (
                      <span className="text-[10px] px-2 py-0.5 rounded bg-charcoal-deep border border-silver-muted/30 text-silver-muted font-bold">
                        Not Connected
                      </span>
                    )}
                  </div>

                  {hubSpotOAuth.connected ? (
                    <div className="space-y-2 pt-1 border-t border-silver-muted/10">
                      <p className="text-[11px] text-emerald-400/90">
                        ✓ Your HubSpot account is linked via OAuth 2.0. Access tokens refresh automatically without interruption.
                      </p>
                      <button
                        type="button"
                        onClick={handleDisconnectHubSpot}
                        className="text-[11px] text-red-400 hover:text-red-300 underline font-medium"
                      >
                        Disconnect HubSpot Account
                      </button>
                    </div>
                  ) : (
                    <div className="space-y-2 pt-1 border-t border-silver-muted/10">
                      <p className="text-[11px] text-text-muted">
                        Connect your HubSpot portal with 1 click using your HubSpot Developer App:
                      </p>
                      <button
                        type="button"
                        disabled={isConnectingHubSpot}
                        onClick={handleConnectHubSpotOAuth}
                        className="w-full py-2 bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-400 hover:to-amber-400 text-charcoal-deep font-bold text-xs rounded-xl shadow transition-all flex items-center justify-center gap-1.5"
                      >
                        <span>{isConnectingHubSpot ? "Opening HubSpot..." : "🟠 Connect with HubSpot (OAuth 2.0)"}</span>
                      </button>
                    </div>
                  )}
                </div>

                {/* API Diagnostics Panel */}
                <div className="p-3 bg-charcoal-deep border border-silver-muted/15 rounded-xl space-y-1.5">
                  <div className="flex items-center justify-between text-xs">
                    <span className="font-semibold text-silver-muted">Live CRM Connectivity:</span>
                    {isTestingHubSpot ? (
                      <span className="text-[10px] text-amber-400 animate-pulse font-mono">Testing...</span>
                    ) : hubSpotStatus?.success ? (
                      <span className="text-[10px] text-emerald-400 font-bold">
                        ✓ Active ({hubSpotStatus.contact_count || 0} leads in CRM)
                      </span>
                    ) : (
                      <span className="text-[10px] text-amber-400 font-medium">
                        {hubSpotStatus ? "Check credentials" : "Not tested yet"}
                      </span>
                    )}
                  </div>
                  {hubSpotStatus?.message && (
                    <p className="text-[10px] text-text-muted">{hubSpotStatus.message}</p>
                  )}
                </div>

                {/* Actions */}
                <div className="flex items-center justify-between gap-2 pt-2">
                  <button
                    type="button"
                    disabled={isTestingHubSpot}
                    onClick={handleTestHubSpotConnection}
                    className="px-3.5 py-2 bg-charcoal border border-silver-muted/20 text-silver hover:text-text-primary text-xs rounded-xl transition-all"
                  >
                    {isTestingHubSpot ? "Testing..." : "🔍 Test Connection"}
                  </button>
                  <button
                    type="button"
                    disabled={isImporting}
                    onClick={handleHubSpotConnect}
                    className="px-4 py-2 bg-gradient-to-r from-orange-600 to-amber-600 hover:from-orange-500 hover:to-amber-500 text-white font-bold text-xs rounded-xl shadow-lg transition-all"
                  >
                    {isImporting ? "Syncing..." : "Sync & Import Leads →"}
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // -------------------------------------------------------------
    // VIEW 1: CAMPAIGNS VIEW (Create, Batch Generate, Send, Inspect)
    // -------------------------------------------------------------
    function CampaignsView({ token, bots, contacts, campaigns, reloadCampaigns, showToast }) {
      const [selectedCampaign, setSelectedCampaign] = useState(null);
      const [showCreateModal, setShowCreateModal] = useState(false);
      const [name, setName] = useState("");
      const [botId, setBotId] = useState(bots[0]?.id || "");
      const [selectedContactIds, setSelectedContactIds] = useState([]);
      const [goal, setGoal] = useState("");
      const [isGenerating, setIsGenerating] = useState(false);
      const [isSending, setIsSending] = useState(false);
      const [viewEmailModal, setViewEmailModal] = useState(null);

      useEffect(() => {
        if (bots.length > 0 && !botId) {
          setBotId(bots[0].id);
        }
      }, [bots]);

      const handleCreateCampaign = async (e) => {
        e.preventDefault();
        if (!name.trim() || !botId) return;

        try {
          const res = await fetch(`${API_BASE}/api/campaigns`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({
              name: name.trim(),
              bot_id: botId,
              contact_ids: selectedContactIds,
              campaign_goal: goal.trim() || undefined,
            }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || "Failed creating campaign");

          showToast(`Campaign "${name}" created with ${selectedContactIds.length} recipients!`);
          setShowCreateModal(false);
          setName("");
          setSelectedContactIds([]);
          setGoal("");
          reloadCampaigns();
          setSelectedCampaign(data);
        } catch (err) {
          alert(err.message);
        }
      };

      const handleSelectCampaign = async (campSummary) => {
        try {
          const res = await fetch(`${API_BASE}/api/campaigns/${campSummary.id}`, {
            headers: { Authorization: `Bearer ${token}` },
          });
          const detail = await res.json();
          setSelectedCampaign(detail);
        } catch (err) {
          console.error("Error loading campaign details:", err);
        }
      };

      const handleGenerateAll = async () => {
        if (!selectedCampaign) return;
        setIsGenerating(true);
        try {
          const res = await fetch(`${API_BASE}/api/campaigns/${selectedCampaign.id}/generate`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({
              campaign_goal: goal || undefined,
            }),
          });
          const updated = await safeJson(res);
          if (!res.ok) throw new Error(updated.detail || "Email generation failed");

          setSelectedCampaign(updated);
          reloadCampaigns();
          showToast(`Generated ${updated.emails.length} personalized emails with RAG!`);
        } catch (err) {
          alert(err.message);
        } finally {
          setIsGenerating(false);
        }
      };

      const handleSendCampaign = async () => {
        if (!selectedCampaign) return;
        if (!confirm(`Are you sure you want to dispatch campaign "${selectedCampaign.name}" to ${selectedCampaign.emails.length} contacts?`)) return;

        setIsSending(true);
        try {
          const res = await fetch(`${API_BASE}/api/campaigns/${selectedCampaign.id}/send`, {
            method: "POST",
            headers: {
              Authorization: `Bearer ${token}`,
            },
          });
          const result = await res.json();
          if (!res.ok) throw new Error(result.detail || "Dispatch failed");
          showToast(result.message);
          // Refresh detail
          handleSelectCampaign(selectedCampaign);
          reloadCampaigns();
        } catch (err) {
          alert(err.message);
        } finally {
          setIsSending(false);
        }
      };

      const handleDeleteCampaign = async (cid) => {
        if (!confirm("Are you sure you want to delete this campaign?")) return;
        try {
          const res = await fetch(`${API_BASE}/api/campaigns/${cid}`, {
            method: "DELETE",
            headers: { Authorization: `Bearer ${token}` },
          });
          if (!res.ok) throw new Error("Deletion failed");
          showToast("Campaign deleted");
          if (selectedCampaign?.id === cid) setSelectedCampaign(null);
          reloadCampaigns();
        } catch (err) {
          alert(err.message);
        }
      };

      return (
        <div className="p-8 max-w-7xl mx-auto w-full">
          {/* Header */}
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
            <div>
              <h1 className="text-2xl font-bold text-text-primary tracking-tight">Outreach Campaigns</h1>
              <p className="text-xs text-text-muted mt-1">
                Synthesize website factual knowledge into hyper-personalized emails and dispatch campaigns.
              </p>
            </div>
            <button
              type="button"
              onClick={() => setShowCreateModal(true)}
              className="px-4 py-2.5 bg-gold hover:bg-gold-bright text-charcoal-deep font-bold rounded-xl text-xs flex items-center gap-2 shadow-lg transition-all self-start"
            >
              <span>+</span>
              <span>New Campaign</span>
            </button>
          </div>

          {/* Campaign List Grid */}
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
            {campaigns.map((c) => {
              const isSelected = selectedCampaign?.id === c.id;
              return (
                <div
                  key={c.id}
                  onClick={() => handleSelectCampaign(c)}
                  className={`p-5 rounded-2xl border transition-all cursor-pointer ${
                    isSelected
                      ? "bg-graphite border-gold shadow-lg shadow-gold/5"
                      : "bg-charcoal border-silver-muted/15 hover:border-silver-muted/30 hover:bg-graphite/40"
                  }`}
                >
                  <div className="flex items-center justify-between mb-3">
                    <span className="font-mono text-[10px] text-silver-muted uppercase tracking-wider">
                      {c.bot_name || "Website Source"}
                    </span>
                    <span
                      className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${
                        c.status === "COMPLETED"
                          ? "bg-emerald-950/60 text-emerald-300 border border-emerald-500/30"
                          : c.status === "READY"
                          ? "bg-gold/20 text-gold-bright border border-gold/40"
                          : c.status === "GENERATING" || c.status === "SENDING"
                          ? "bg-blue-950/60 text-blue-300 border border-blue-500/30 animate-pulse"
                          : "bg-charcoal-deep text-silver-muted border border-silver-muted/20"
                      }`}
                    >
                      {c.status}
                    </span>
                  </div>
                  <h3 className="font-bold text-sm text-text-primary mb-1">{c.name}</h3>
                  <div className="flex items-center gap-4 text-xs text-text-muted mt-4 pt-3 border-t border-silver-muted/10">
                    <div>
                      <span className="font-semibold text-text-primary">{c.total_emails}</span> Recipients
                    </div>
                    <div>
                      <span className="font-semibold text-emerald-400">{c.sent_emails}</span> Sent
                    </div>
                  </div>
                </div>
              );
            })}
            {campaigns.length === 0 && (
              <div className="col-span-3 p-12 text-center bg-charcoal rounded-2xl border border-dashed border-silver-muted/20">
                <p className="text-sm font-semibold text-text-primary mb-1">No campaigns created yet</p>
                <p className="text-xs text-text-muted mb-4">Launch your first RAG email campaign in seconds.</p>
                <button
                  type="button"
                  onClick={() => setShowCreateModal(true)}
                  className="px-4 py-2 bg-gold hover:bg-gold-bright text-charcoal-deep font-bold rounded-xl text-xs"
                >
                  + Create First Campaign
                </button>
              </div>
            )}
          </div>

          {/* Selected Campaign Details Workspace */}
          {selectedCampaign && (
            <div className="bg-graphite border border-silver-muted/20 rounded-2xl p-6 shadow-xl">
              <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6 pb-6 border-b border-silver-muted/15">
                <div>
                  <div className="flex items-center gap-3">
                    <h2 className="text-lg font-bold text-text-primary">{selectedCampaign.name}</h2>
                    <span className="px-2.5 py-0.5 rounded-full text-xs font-bold bg-charcoal text-gold-bright border border-gold/30">
                      {selectedCampaign.status}
                    </span>
                  </div>
                  <p className="text-xs text-text-muted mt-1">
                    Knowledge Source: <span className="text-silver-bright font-medium">{selectedCampaign.bot_name}</span> | Recipients: {selectedCampaign.total_emails} | Dispatched: {selectedCampaign.sent_emails}
                  </p>
                </div>

                <div className="flex flex-wrap items-center gap-2">
                  <button
                    type="button"
                    disabled={isGenerating || selectedCampaign.emails.length === 0}
                    onClick={handleGenerateAll}
                    className="px-4 py-2 bg-charcoal hover:bg-charcoal-deep border border-gold/40 text-gold-bright font-bold rounded-xl text-xs flex items-center gap-2 transition-all disabled:opacity-50"
                  >
                    <span>{isGenerating ? "⏳ Generating..." : "⚡ Generate All Emails (RAG)"}</span>
                  </button>
                  <button
                    type="button"
                    disabled={isSending || selectedCampaign.emails.length === 0 || selectedCampaign.status === "COMPLETED"}
                    onClick={handleSendCampaign}
                    className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl text-xs flex items-center gap-2 shadow-lg transition-all disabled:opacity-50"
                  >
                    <span>{isSending ? "🚀 Dispatching..." : "🚀 Send Campaign"}</span>
                  </button>
                  <button
                    type="button"
                    onClick={() => handleDeleteCampaign(selectedCampaign.id)}
                    className="p-2 bg-charcoal hover:bg-rose-950/40 text-silver-muted hover:text-rose-400 border border-silver-muted/20 rounded-xl text-xs transition-colors"
                    title="Delete Campaign"
                  >
                    🗑️
                  </button>
                </div>
              </div>

              {/* Campaign Emails Table */}
              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs">
                  <thead>
                    <tr className="border-b border-silver-muted/15 text-silver-muted font-bold uppercase tracking-wider text-[10px]">
                      <th className="pb-3 px-3">Recipient</th>
                      <th className="pb-3 px-3">Company / Role</th>
                      <th className="pb-3 px-3">Subject Line Preview</th>
                      <th className="pb-3 px-3">Status</th>
                      <th className="pb-3 px-3 text-right">Action</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-silver-muted/10">
                    {selectedCampaign.emails?.map((e) => (
                      <tr key={e.id} className="hover:bg-charcoal/40 transition-colors">
                        <td className="py-3.5 px-3">
                          <div className="font-bold text-text-primary">{e.contact_name || "Unknown"}</div>
                          <div className="text-[11px] text-silver-muted">{e.contact_email}</div>
                        </td>
                        <td className="py-3.5 px-3">
                          <div className="text-text-primary">{e.contact_company || "—"}</div>
                          <div className="text-[11px] text-text-muted">{e.contact_role || "—"}</div>
                        </td>
                        <td className="py-3.5 px-3 max-w-xs truncate">
                          {e.subject ? (
                            <span className="text-silver-bright font-medium">{e.subject}</span>
                          ) : (
                            <span className="text-text-muted italic">Draft not generated yet</span>
                          )}
                        </td>
                        <td className="py-3.5 px-3">
                          <span
                            className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${
                              e.status === "SENT"
                                ? "bg-emerald-950/60 text-emerald-300 border border-emerald-500/30"
                                : e.status === "GENERATED"
                                ? "bg-gold/20 text-gold-bright border border-gold/40"
                                : "bg-charcoal text-silver-muted border border-silver-muted/20"
                            }`}
                          >
                            {e.status}
                          </span>
                        </td>
                        <td className="py-3.5 px-3 text-right">
                          {e.subject ? (
                            <button
                              type="button"
                              onClick={() => setViewEmailModal(e)}
                              className="px-2.5 py-1 bg-charcoal hover:bg-graphite text-gold-bright border border-gold/30 rounded-lg text-xs font-semibold"
                            >
                              Review Draft
                            </button>
                          ) : (
                            <span className="text-text-muted text-[11px]">Pending Gen</span>
                          )}
                        </td>
                      </tr>
                    ))}
                    {selectedCampaign.emails?.length === 0 && (
                      <tr>
                        <td colSpan="5" className="py-8 text-center text-text-muted italic">
                          No contacts attached to this campaign.
                        </td>
                      </tr>
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {/* Create Campaign Modal */}
          {showCreateModal && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="bg-graphite border border-silver-muted/20 rounded-2xl w-full max-w-lg p-6 shadow-2xl max-h-[90vh] flex flex-col">
                <h3 className="text-base font-bold text-text-primary mb-1">Create Email Outreach Campaign</h3>
                <p className="text-xs text-text-muted mb-4">
                  Define your campaign, link a knowledge source, and select targeted audience contacts.
                </p>

                <form onSubmit={handleCreateCampaign} className="space-y-4 flex-1 overflow-y-auto pr-1">
                  <div>
                    <label className="block text-xs font-semibold text-silver-muted mb-1">Campaign Name</label>
                    <input
                      type="text"
                      required
                      value={name}
                      onChange={(e) => setName(e.target.value)}
                      placeholder="e.g. Q4 Healthcare Automation Outreach"
                      className="w-full px-3 py-2 bg-charcoal border border-silver-muted/20 rounded-xl text-xs text-text-primary focus:outline-none focus:border-gold"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-silver-muted mb-1">Knowledge Source (Bot)</label>
                    <select
                      value={botId}
                      onChange={(e) => setBotId(e.target.value)}
                      required
                      className="w-full px-3 py-2 bg-charcoal border border-silver-muted/20 rounded-xl text-xs text-text-primary focus:outline-none focus:border-gold"
                    >
                      {bots.map((b) => (
                        <option key={b.id} value={b.id}>
                          {b.name} ({b.website_url})
                        </option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-silver-muted mb-1">Campaign Goal / Pitch Angle</label>
                    <input
                      type="text"
                      value={goal}
                      onChange={(e) => setGoal(e.target.value)}
                      placeholder="e.g. Highlight enterprise security, compliance and ROI"
                      className="w-full px-3 py-2 bg-charcoal border border-silver-muted/20 rounded-xl text-xs text-text-primary focus:outline-none focus:border-gold"
                    />
                  </div>

                  <div>
                    <div className="flex items-center justify-between mb-1.5">
                      <label className="text-xs font-semibold text-silver-muted">Select Target Contacts ({selectedContactIds.length} selected)</label>
                      <button
                        type="button"
                        onClick={() => {
                          if (selectedContactIds.length === contacts.length) setSelectedContactIds([]);
                          else setSelectedContactIds(contacts.map((c) => c.id));
                        }}
                        className="text-[11px] text-gold-bright hover:underline"
                      >
                        {selectedContactIds.length === contacts.length ? "Deselect All" : "Select All"}
                      </button>
                    </div>

                    <div className="max-h-48 overflow-y-auto bg-charcoal border border-silver-muted/20 rounded-xl p-2 space-y-1.5 divide-y divide-silver-muted/10">
                      {contacts.map((c) => {
                        const checked = selectedContactIds.includes(c.id);
                        return (
                          <label key={c.id} className="flex items-center gap-3 p-1.5 hover:bg-graphite/40 rounded-lg cursor-pointer text-xs">
                            <input
                              type="checkbox"
                              checked={checked}
                              onChange={() => {
                                if (checked) setSelectedContactIds(selectedContactIds.filter((id) => id !== c.id));
                                else setSelectedContactIds([...selectedContactIds, c.id]);
                              }}
                              className="rounded border-silver-muted/30 text-gold focus:ring-gold bg-graphite"
                            />
                            <div className="truncate">
                              <span className="font-semibold text-text-primary">{c.name}</span>{" "}
                              <span className="text-text-muted">({c.company || c.email})</span>
                            </div>
                          </label>
                        );
                      })}
                      {contacts.length === 0 && (
                        <p className="p-4 text-center text-xs text-text-muted">No contacts yet. Import mock leads from the Contacts tab.</p>
                      )}
                    </div>

    // -------------------------------------------------------------
    // VIEW 2: CONTACTS VIEW (CRUD, Mock Import, CSV Upload)
    // -------------------------------------------------------------
    function ContactsView({ token, contacts, reloadContacts, showToast, onSelectContactForGenerator }) {
      const [showAddModal, setShowAddModal] = useState(false);
      const [name, setName] = useState("");
      const [email, setEmail] = useState("");
      const [company, setCompany] = useState("");
      const [role, setRole] = useState("");
      const fileInputRef = useRef(null);

      const handleAddContact = async (e) => {
        e.preventDefault();
        try {
          const res = await fetch(`${API_BASE}/api/contacts`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({ name, email, company, role }),
          });
          if (!res.ok) {
            const err = await res.json();
            throw new Error(err.detail || "Failed adding contact");
          }
          showToast(`Contact "${name}" added successfully.`);
          setShowAddModal(false);
          setName("");
          setEmail("");
          setCompany("");
          setRole("");
          reloadContacts();
        } catch (err) {
          alert(err.message);
        }
      };

      const handleImportMock = async () => {
        try {
          const res = await fetch(`${API_BASE}/api/contacts/import-mock`, {
            method: "POST",
            headers: { Authorization: `Bearer ${token}` },
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || "Mock import failed");
          showToast(`Imported ${data.imported} curated sample leads!`);
          reloadContacts();
        } catch (err) {
          alert(err.message);
        }
      };

      const handleCsvUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const formData = new FormData();
        formData.append("file", file);

        try {
          const res = await fetch(`${API_BASE}/api/contacts/import-csv`, {
            method: "POST",
            headers: { Authorization: `Bearer ${token}` },
            body: formData,
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || "CSV upload failed");
          showToast(`Imported ${data.imported} contacts from CSV!`);
          reloadContacts();
        } catch (err) {
          alert(err.message);
        } finally {
          e.target.value = "";
        }
      };

      const handleDeleteContact = async (cid) => {
        if (!confirm("Delete contact?")) return;
        try {
          const res = await fetch(`${API_BASE}/api/contacts/${cid}`, {
            method: "DELETE",
            headers: { Authorization: `Bearer ${token}` },
          });
          if (!res.ok) throw new Error("Delete failed");
          showToast("Contact deleted");
          reloadContacts();
        } catch (err) {
          alert(err.message);
        }
      };

      return (
        <div className="p-8 max-w-7xl mx-auto w-full">
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
            <div>
              <h1 className="text-2xl font-bold text-text-primary tracking-tight">Audience Contacts</h1>
              <p className="text-xs text-text-muted mt-1">
                Manage recipient leads, populate mock demonstration data, or upload CSV contact rosters.
              </p>
            </div>
            <div className="flex flex-wrap items-center gap-2 self-start">
              <input
                type="file"
                accept=".csv"
                ref={fileInputRef}
                onChange={handleCsvUpload}
                className="hidden"
              />
              <button
                type="button"
                onClick={() => fileInputRef.current?.click()}
                className="px-3.5 py-2 bg-charcoal hover:bg-graphite border border-silver-muted/20 text-silver font-semibold rounded-xl text-xs transition-all flex items-center gap-2"
              >
                <span>📁</span>
                <span>Upload CSV</span>
              </button>
              <button
                type="button"
                onClick={handleImportMock}
                className="px-3.5 py-2 bg-charcoal hover:bg-graphite border border-gold/40 text-gold-bright font-semibold rounded-xl text-xs transition-all flex items-center gap-2"
              >
                <span>⚡</span>
                <span>Import Mock Leads</span>
              </button>
              <button
                type="button"
                onClick={() => setShowAddModal(true)}
                className="px-4 py-2 bg-gold hover:bg-gold-bright text-charcoal-deep font-bold rounded-xl text-xs flex items-center gap-1.5 shadow-lg transition-all"
              >
                <span>+ Add Contact</span>
              </button>
            </div>
          </div>

          {/* Contacts Table */}
          <div className="bg-graphite border border-silver-muted/20 rounded-2xl overflow-hidden shadow-xl">
            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs">
                <thead>
                  <tr className="border-b border-silver-muted/15 bg-charcoal text-silver-muted font-bold uppercase tracking-wider text-[10px]">
                    <th className="py-3 px-4">Contact</th>
                    <th className="py-3 px-4">Company</th>
                    <th className="py-3 px-4">Role / Title</th>
                    <th className="py-3 px-4">Interests / Custom Variables</th>
                    <th className="py-3 px-4 text-right">Actions</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-silver-muted/10">
                  {contacts.map((c) => (
                    <tr key={c.id} className="hover:bg-charcoal/40 transition-colors">
                      <td className="py-3 px-4">
                        <div className="font-bold text-text-primary">{c.name}</div>
                        <div className="text-[11px] text-silver-muted">{c.email}</div>
                      </td>
                      <td className="py-3 px-4 text-silver-bright font-medium">{c.company || "—"}</td>
                      <td className="py-3 px-4 text-text-muted">{c.role || "—"}</td>
                      <td className="py-3 px-4">
                        {c.custom_variables && Object.keys(c.custom_variables).length > 0 ? (
                          <div className="flex flex-wrap gap-1">
                            {Object.entries(c.custom_variables).map(([k, v]) => (
                              <span key={k} className="px-2 py-0.5 rounded-md text-[10px] bg-charcoal text-gold-bright border border-gold/20 font-mono">
                                {k}: {String(v)}
                              </span>

                        ) : (
                          <span className="text-text-muted text-[11px]">—</span>

                      </td>
                      <td className="py-3 px-4 text-right space-x-2">
                        <button
                          type="button"
                          onClick={() => onSelectContactForGenerator(c)}
                          className="px-2.5 py-1 bg-charcoal hover:bg-graphite text-gold-bright border border-gold/30 rounded-lg text-xs font-semibold"
                        >
                          Generate Email
                        </button>
                        <button
                          type="button"
                          onClick={() => handleDeleteContact(c.id)}

                          title="Delete Contact"

                          ✕
                        </button>
                      </td>
                    </tr>
                  ))}
                  {contacts.length === 0 && (
                    <tr>
                      <td colSpan="5" className="py-12 text-center text-text-muted italic">

                      </td>
                    </tr>
                  )}
                </tbody>
              </table>
            </div>
          </div>

          {/* Add Contact Modal */}
          {showAddModal && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="bg-graphite border border-silver-muted/20 rounded-2xl w-full max-w-md p-6 shadow-2xl">
                <h3 className="text-base font-bold text-text-primary mb-1">Add New Contact</h3>
                <p className="text-xs text-text-muted mb-4">Enter recipient details for personalized RAG outreach.</p>
                <form onSubmit={handleAddContact} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-silver-muted mb-1">Full Name</label>
                    <input
                      type="text"
                      required
                      value={name}
                      onChange={(e) => setName(e.target.value)}
                      placeholder="e.g. Sarah Connor"
                      className="w-full px-3 py-2 bg-charcoal border border-silver-muted/20 rounded-xl text-xs text-text-primary focus:outline-none focus:border-gold"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-silver-muted mb-1">Email Address</label>
                    <input
                      type="email"
                      required
                      value={email}
                      onChange={(e) => setEmail(e.target.value)}
                      placeholder="sarah@example.com"
                      className="w-full px-3 py-2 bg-charcoal border border-silver-muted/20 rounded-xl text-xs text-text-primary focus:outline-none focus:border-gold"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-silver-muted mb-1">Company</label>
                    <input
                      type="text"
                      value={company}
                      onChange={(e) => setCompany(e.target.value)}
                      placeholder="e.g. Cyberdyne Systems"
                      className="w-full px-3 py-2 bg-charcoal border border-silver-muted/20 rounded-xl text-xs text-text-primary focus:outline-none focus:border-gold"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-silver-muted mb-1">Role / Job Title</label>
                    <input
                      type="text"
                      value={role}
                      onChange={(e) => setRole(e.target.value)}
                      placeholder="e.g. Chief Security Officer"
                      className="w-full px-3 py-2 bg-charcoal border border-silver-muted/20 rounded-xl text-xs text-text-primary focus:outline-none focus:border-gold"
                    />
                  </div>
                  <div className="flex justify-end gap-2 pt-2 border-t border-silver-muted/15">
                    <button
                      type="button"
                      onClick={() => setShowAddModal(false)}
                      className="px-4 py-2 bg-charcoal border border-silver-muted/20 text-silver hover:text-text-primary rounded-xl text-xs"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 bg-gold hover:bg-gold-bright text-charcoal-deep font-bold rounded-xl text-xs"

                      Save Contact

            </div>

        </div>
      );
    }

    // -------------------------------------------------------------
    // VIEW 3: QUICK EMAIL STUDIO (Instant 1-on-1 RAG Email Draft)
    // -------------------------------------------------------------
    function EmailGeneratorView({ token, bots, activeBot, contacts, showToast }) {
      const [selectedBotId, setSelectedBotId] = useState(activeBot?.id || bots[0]?.id || "");
      const [selectedContactId, setSelectedContactId] = useState(contacts[0]?.id || "");
      const [goal, setGoal] = useState("");
      const [instructions, setInstructions] = useState("");
      const [isGenerating, setIsGenerating] = useState(false);
      const [generatedDraft, setGeneratedDraft] = useState(null);

      useEffect(() => {
        if (bots.length > 0 && !selectedBotId) setSelectedBotId(bots[0].id);
      }, [bots]);

      useEffect(() => {
        if (contacts.length > 0 && !selectedContactId) setSelectedContactId(contacts[0].id);
      }, [contacts]);

      const handleGenerate = async (e) => {
        e.preventDefault();
        if (!selectedBotId || !selectedContactId) return;

        setIsGenerating(true);
        try {
          const res = await fetch(
            `${API_BASE}/api/bots/${selectedBotId}/contacts/${selectedContactId}/generate-email`,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${token}`,
              },
              body: JSON.stringify({
                campaign_goal: goal || undefined,
                custom_instructions: instructions || undefined,
              }),
            }
          );
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || "Generation failed");
          setGeneratedDraft(data);
          showToast("Personalized email draft created successfully!");
        } catch (err) {
          alert(err.message);
        } finally {
          setIsGenerating(false);
        }
      };

      return (
        <div className="p-8 max-w-7xl mx-auto w-full">
          <div className="mb-8">
            <h1 className="text-2xl font-bold text-text-primary tracking-tight">AI Email Studio</h1>
            <p className="text-xs text-text-muted mt-1">
              Test real-time personalized email generation combining recipient context with website knowledge.
            </p>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
            {/* Generation Controls */}
            <div className="lg:col-span-5 bg-graphite border border-silver-muted/20 rounded-2xl p-6 shadow-xl space-y-4">
              <h3 className="text-sm font-bold text-text-primary pb-3 border-b border-silver-muted/15">
                Outreach Parameters

                <div>
                  <label className="block text-xs font-semibold text-silver-muted mb-1">Target Recipient</label>
                  <select
                    value={selectedContactId}
                    onChange={(e) => setSelectedContactId(e.target.value)}
                    required
                    className="w-full px-3 py-2 bg-charcoal border border-silver-muted/20 rounded-xl text-xs text-text-primary focus:outline-none focus:border-gold"
                  >
                    {contacts.map((c) => (
                      <option key={c.id} value={c.id}>
                        {c.name} — {c.company || c.email} ({c.role || "Lead"})
                      </option>
                    ))}
                    {contacts.length === 0 && <option value="">No contacts found</option>}
                  </select>
                </div>

                <div>
                  <label className="block text-xs font-semibold text-silver-muted mb-1">Knowledge Source (Website Bot)</label>
                  <select
                    value={selectedBotId}
                    onChange={(e) => setSelectedBotId(e.target.value)}
                    required
                    className="w-full px-3 py-2 bg-charcoal border border-silver-muted/20 rounded-xl text-xs text-text-primary focus:outline-none focus:border-gold"
                  >
                    {bots.map((b) => (
                      <option key={b.id} value={b.id}>
                        {b.name} ({b.website_url})
                      </option>
                    ))}
                  </select>
                </div>

                <div>
                  <label className="block text-xs font-semibold text-silver-muted mb-1">Outreach Goal / Angle</label>
                  <input
                    type="text"
                    value={goal}
                    onChange={(e) => setGoal(e.target.value)}
                    placeholder="e.g. Introduce enterprise AI capabilities and offer demo"
                    className="w-full px-3 py-2 bg-charcoal border border-silver-muted/20 rounded-xl text-xs text-text-primary focus:outline-none focus:border-gold"
                  />
                </div>

                <div>
                  <label className="block text-xs font-semibold text-silver-muted mb-1">Special Copywriting Instructions</label>
                  <textarea
                    rows="3"

                <button

                    <div className="flex items-center justify-between mb-1">
                      <span className="text-[10px] font-bold text-silver-muted uppercase tracking-wider">Email Body</span>
                      <button
                        type="button"
                        onClick={() => {
                          navigator.clipboard.writeText(generatedDraft.body);
                          showToast("Body copied!");
                        }}
                        className="text-[11px] text-gold-bright hover:underline"
                      >
                        Copy
                      </button>
                    </div>
                    <div className="flex-1 p-4 bg-charcoal border border-silver-muted/20 rounded-xl text-xs text-text-primary leading-relaxed whitespace-pre-wrap font-sans overflow-y-auto">
                      {generatedDraft.body}
                    </div>
                  </div>

                  <div className="pt-3 border-t border-silver-muted/15 flex justify-between items-center text-[11px] text-text-muted">
                    <span>Target: {generatedDraft.recipient_name} ({generatedDraft.recipient_email})</span>
                    <button
                      type="button"
                      onClick={() => {
                        navigator.clipboard.writeText(`Subject: ${generatedDraft.subject}\n\n${generatedDraft.body}`);
                        showToast("Entire draft copied to clipboard!");
                      }}
                      className="px-3 py-1.5 bg-charcoal hover:bg-charcoal-deep border border-gold/30 text-gold-bright font-bold rounded-xl text-xs transition-all"
                    >
                      📋 Copy Full Email
                    </button>
                  </div>
                </div>
              ) : (
                <div className="flex-1 flex flex-col items-center justify-center p-12 text-center text-text-muted italic border border-dashed border-silver-muted/20 rounded-xl">
                  <span className="text-3xl mb-2">✉️</span>
                  <p className="text-xs">Select a recipient and click "Generate Personalized Email" to preview the RAG draft here.</p>
                </div>

            </div>
          </div>
        </div>
      );

    // -------------------------------------------------------------
    // VIEW 4: CRAWL & KNOWLEDGE VIEW (Retained & Enhanced)
    // -------------------------------------------------------------
    function CrawlKnowledgeView({ token, bot, onBotUpdated, showToast }) {
      const [isCrawling, setIsCrawling] = useState(false);
      const [crawlStats, setCrawlStats] = useState(null);
      const [pages, setPages] = useState([]);
      const [activeTab, setActiveTab] = useState("overview");

      useEffect(() => {
        if (bot) {
          loadCrawlData();
        }
      }, [bot]);

      const loadCrawlData = () => {
        if (!bot) return;
        fetch(`${API_BASE}/api/bots/${bot.id}/pages`, {
          headers: { Authorization: `Bearer ${token}` },
        })
          .then((res) => res.json())
          .then((data) => setPages(data.pages || []))
          .catch((err) => console.error("Failed loading pages:", err));


        fetch(`${API_BASE}/api/bots/${bot.id}/crawl/status`, {
          headers: { Authorization: `Bearer ${token}` },
        })
          .then((res) => res.json())
          .then((data) => {
            setCrawlStats(data);
            if (data.status === "CRAWLING" || data.status === "PROCESSING" || data.status === "INDEXING") {
              setTimeout(loadCrawlData, 3000);
            }
          })
          .catch(() => {});
      };

      const handleTriggerCrawl = async () => {
        if (!bot) return;
        setIsCrawling(true);
        try {
          const res = await fetch(`${API_BASE}/api/bots/${bot.id}/crawl`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({ max_pages: 50 }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || "Crawl initiation failed");
          showToast("Crawler dispatched. Ingesting website pages...");
          loadCrawlData();
          onBotUpdated();
        } catch (err) {
          alert(err.message);
        } finally {
          setIsCrawling(false);
        }
      };

      if (!bot) {
        return (
          <div className="p-8 text-center text-text-muted">
            Please select or create a website source from the sidebar.
          </div>
        );
      }

      return (
        <div className="p-8 max-w-7xl mx-auto w-full">
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
            <div>
              <div className="flex items-center gap-3">
                <h1 className="text-2xl font-bold text-text-primary tracking-tight">{bot.name}</h1>
                <span className="px-2.5 py-0.5 rounded-full text-xs font-bold bg-charcoal text-gold border border-gold/30">
                  {bot.status}
                </span>
              </div>
              <p className="text-xs text-text-muted mt-1">{bot.website_url}</p>
            </div>
            <button
              type="button"
              onClick={handleTriggerCrawl}
              disabled={isCrawling || bot.status === "CRAWLING"}
              className="px-4 py-2.5 bg-gold hover:bg-gold-bright text-charcoal-deep font-bold rounded-xl text-xs flex items-center gap-2 shadow-lg transition-all self-start disabled:opacity-50"
            >
              <span>{isCrawling ? "⏳ Crawling..." : "🔄 Re-Crawl & Index Website"}</span>
            </button>
          </div>

          <div className="bg-graphite border border-silver-muted/20 rounded-2xl p-6 shadow-xl">
            <h3 className="text-sm font-bold text-text-primary mb-4">Indexed Knowledge Pages ({pages.length})</h3>
            <div className="divide-y divide-silver-muted/10 max-h-96 overflow-y-auto">
              {pages.map((p) => (
                <div key={p.id} className="py-3 px-2 flex items-center justify-between hover:bg-charcoal/40 rounded-lg">
                  <div className="truncate pr-4">
                    <div className="text-xs font-bold text-silver-bright truncate">{p.title || p.url}</div>
                    <div className="text-[11px] text-text-muted truncate">{p.url}</div>
                  </div>
                  <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-charcoal text-emerald-400 border border-emerald-500/20 shrink-0">
                    {p.crawl_status || "SUCCESS"}
                  </span>
                </div>
              ))}
              {pages.length === 0 && (
                <p className="py-8 text-center text-xs text-text-muted italic">
                  No indexed pages found yet. Click "Re-Crawl & Index Website" to populate knowledge.
                </p>
              )}
            </div>
          </div>
        </div>
      );
    }

    // -------------------------------------------------------------
    // VIEW 5: BOTS OVERVIEW VIEW (Retained for Test & Source Mgmt)
    // -------------------------------------------------------------
    function BotsOverviewView({ token, bots, activeBot, onSelectBot, onNewBot, onGoToCrawl }) {
      return (
        <div className="p-8 max-w-7xl mx-auto w-full">
          <div className="flex items-center justify-between mb-8">
            <div>
              <h1 className="text-2xl font-bold text-text-primary">Website Knowledge Sources</h1>
              <p className="text-xs text-text-muted mt-1">Configured website domains acting as source material for RAG outreach.</p>
            </div>
            <button
              type="button"
              onClick={onNewBot}
              className="px-4 py-2 bg-gold hover:bg-gold-bright text-charcoal-deep font-bold rounded-xl text-xs shadow-lg"
            >
              + Add New Website
            </button>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            {bots.map((b) => (
              <div
                key={b.id}
                onClick={() => onSelectBot(b)}
                className={`p-5 rounded-2xl border transition-all cursor-pointer ${
                  activeBot?.id === b.id
                    ? "bg-graphite border-gold shadow-lg shadow-gold/5"
                    : "bg-charcoal border-silver-muted/20 hover:border-silver-muted/40"
                }`}
              >
                <div className="flex items-center justify-between mb-2">
                  <h3 className="font-bold text-sm text-text-primary">{b.name}</h3>
                  <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-charcoal-deep text-gold border border-gold/30">
                    {b.status}
                  </span>
                </div>
                <p className="text-xs text-text-muted truncate mb-4">{b.website_url}</p>
                <button
                  type="button"
                  onClick={(e) => { e.stopPropagation(); onSelectBot(b); onGoToCrawl(); }}
                  className="w-full py-1.5 bg-charcoal hover:bg-charcoal-deep border border-silver-muted/20 text-silver-bright rounded-lg text-xs font-semibold"
                >
                  Manage Knowledge & Crawl
                </button>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // -------------------------------------------------------------
    // VIEW 6: BRANDING CUSTOMIZER VIEW (Retained for Test Suite)
    // -------------------------------------------------------------
    function BrandingCustomizerView({ token, bot, showToast }) {
      const [branding, setBranding] = useState({
        company_name: "",
        primary_color: "#D6A84F",
        welcome_message: "How can I help you?",
        position: "bottom-right",
      });

      useEffect(() => {
        if (bot) {
          fetch(`${API_BASE}/api/bots/${bot.id}/branding`, {
            headers: { Authorization: `Bearer ${token}` },
          })
            .then((res) => res.json())
            .then((data) => setBranding(data))
            .catch(() => {});
        }
      }, [bot]);

      const handleSave = async (e) => {
        e.preventDefault();
        try {
          const res = await fetch(`${API_BASE}/api/bots/${bot.id}/branding`, {
            method: "PUT",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify(branding),
          });
          if (!res.ok) throw new Error("Failed to save branding");
          showToast("Branding settings saved successfully.");
        } catch (err) {
          alert(err.message);
        }
      };

      if (!bot) return <div className="p-8 text-center text-text-muted">Select a bot first.</div>;

      return (
        <div className="p-8 max-w-4xl mx-auto w-full">
          <h1 className="text-2xl font-bold text-text-primary mb-6">Branding Settings</h1>
          <form onSubmit={handleSave} className="bg-graphite border border-silver-muted/20 rounded-2xl p-6 space-y-4">
            <div>
              <label className="block text-xs font-semibold text-silver-muted mb-1">Company / Brand Name</label>
              <input
                type="text"
                value={branding.company_name || ""}
                onChange={(e) => setBranding({ ...branding, company_name: e.target.value })}
                className="w-full px-3 py-2 bg-charcoal border border-silver-muted/20 rounded-xl text-xs text-text-primary focus:outline-none focus:border-gold"
              />
            </div>
            <div>
              <label className="block text-xs font-semibold text-silver-muted mb-1">Primary Color</label>
              <input
                type="color"
                value={branding.primary_color || "#D6A84F"}
                onChange={(e) => setBranding({ ...branding, primary_color: e.target.value })}
                className="h-9 w-20 bg-charcoal rounded border border-silver-muted/20 cursor-pointer"
              />
            </div>
            <div>
              <label className="block text-xs font-semibold text-silver-muted mb-1">Position</label>
              <select
                value={branding.position || "bottom-right"}
                onChange={(e) => setBranding({ ...branding, position: e.target.value })}
                className="w-full px-3 py-2 bg-charcoal border border-silver-muted/20 rounded-xl text-xs text-text-primary focus:outline-none focus:border-gold"
              >
                <option value="bottom-right">Bottom Right</option>
                <option value="bottom-left">Bottom Left</option>
              </select>
            </div>
            <button
              type="submit"
              className="px-4 py-2 bg-gold hover:bg-gold-bright text-charcoal-deep font-bold rounded-xl text-xs"
            >
              Save Branding
            </button>
          </form>
        </div>
      );
    }

    // -------------------------------------------------------------
    // VIEW 7: EMBED CODE VIEW (Retained for Test Suite)
    // -------------------------------------------------------------
    function EmbedCodeView({ bot, showToast }) {
      if (!bot) return <div className="p-8 text-center text-text-muted">Select a bot first.</div>;

      const snippet = '<' + 'script src="' + API_BASE + '/static/widget.js" data-bot-id="' + bot.id + '" defer><' + '/script>';

      return (
        <div className="p-8 max-w-4xl mx-auto w-full">
          <h1 className="text-2xl font-bold text-text-primary mb-2">Embed Code Snippet</h1>
          <p className="text-xs text-text-muted mb-6">Embed the web conversational widget on any web property.</p>
          <div className="bg-graphite border border-silver-muted/20 rounded-2xl p-6">
            <pre className="p-4 bg-charcoal rounded-xl text-xs font-mono text-gold-bright overflow-x-auto mb-4">
              {snippet}
            </pre>
            <button
              type="button"
              onClick={() => {
                navigator.clipboard.writeText(snippet);
                showToast("Snippet copied to clipboard!");
              }}
              className="px-4 py-2 bg-gold hover:bg-gold-bright text-charcoal-deep font-bold rounded-xl text-xs"
            >
              Copy Embed Code
            </button>
          </div>
        </div>
      );
    }

    // -------------------------------------------------------------
    // VIEW 8: CONVERSATIONS VIEW (Retained for Test Suite)
    // -------------------------------------------------------------
    function ConversationsView({ token, bot }) {
      const [convs, setConvs] = useState([]);

      useEffect(() => {
        if (bot) {
          fetch(`${API_BASE}/api/bots/${bot.id}/conversations`, {
            headers: { Authorization: `Bearer ${token}` },
          })
            .then((res) => res.json())
            .then((data) => setConvs(data.conversations || []))
            .catch(() => {});
        }
      }, [bot]);

      if (!bot) return <div className="p-8 text-center text-text-muted">Select a bot first.</div>;

      return (
        <div className="p-8 max-w-4xl mx-auto w-full">
          <h1 className="text-2xl font-bold text-text-primary mb-2">Visitor Chat Transcripts</h1>
          <p className="text-xs text-text-muted mb-6">Review multi-turn chat sessions for {bot.name}.</p>
          <div className="bg-graphite border border-silver-muted/20 rounded-2xl p-6">
            <div className="divide-y divide-silver-muted/10">
              {convs.map((c) => (
                <div key={c.id} className="py-3 flex justify-between items-center text-xs">
                  <span className="font-mono text-silver-bright">{c.session_id}</span>
                  <span className="text-text-muted">{c.message_count} turns</span>
                </div>
              ))}
              {convs.length === 0 && (
                <p className="py-8 text-center text-xs text-text-muted italic">No conversations recorded yet.</p>
              )}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
